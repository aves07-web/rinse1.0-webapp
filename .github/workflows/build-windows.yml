name: Build Windows Desktop App (32-bit & 64-bit)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Rinse web & server bundles
        run: npm run build

      - name: Package Windows Installer & Portable EXEs (32-bit + 64-bit)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --config electron-builder.json --win --ia32 --x64

      - name: Upload Windows .exe Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rinse-Windows-32bit-64bit
          path: |
            release/*.exe
          if-no-files-found: error
