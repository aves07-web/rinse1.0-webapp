name: Rinse CI Build Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci --include=dev --no-audit --no-fund

      - name: Ensure Linux native bindings
        run: |
          if [ ! -d "node_modules/@rolldown/binding-linux-x64-gnu" ] || [ ! -d "node_modules/@typescript/typescript-linux-x64" ]; then
            npm install --no-save @rolldown/binding-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @typescript/typescript-linux-x64
          fi

      - name: Type-check TypeScript
        run: npm run lint

      - name: Build production web & server bundles
        run: npm run build
